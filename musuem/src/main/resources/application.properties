spring.application.name=musuem

# Banco de dados (valores padrao batem com o docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/museu}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Flyway cria as tabelas; o Hibernate apenas confere se o mapeamento bate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
